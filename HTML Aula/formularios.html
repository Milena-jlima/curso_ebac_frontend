<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários </title>
    <link rel="stylesheet" type="text/css" href="./styles.css">
</head>
    <h1> Formulários</h1>
        <form>
            <label for="name"> Nome: </label>
            <input type="text" id="name" name="name" placeholder="Digite seu nome" required /> <br />
            <label for="email"> E-mail: </label>
            <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required /> <br />
            <label  for="password"> Senha: </label>
            <input type="password" id="password" name="password" placeholder="Digite sua senha" required /> <br /> 
            <label for="telephone"> Telefone: </label>
            <input type="tel" id="telephone" name="telephone" placeholder="Digite seu telefone" /> <br />
            <label for="number"> Número: </label>
            <input type="number" id="number" name="number" max="10" min="1" step="1"
            placeholder="Digite um número" /><br />
            <input type="file" id="file" name="file" /> <br />
            <input type="checkbox" id="subscribe" name="subscribe" />
            <label for="subscribe"> Inscrever-se na newsletter </label> <br />  
            <input type="radio" id="favoritecolor1" name="favoritecolor" value="red" />
            <label for="favoritecolor1"> Vermelho </label>   
            <input type="radio" id="favoritecolor2" name="favoritecolor" value="blue" />
            <label for="favoritecolor2"> Azul </label>    
            <input type="radio" id="favoritecolor3" name="favoritecolor" value="green" />
            <label for="favoritecolor3"> Verde </label>
            <br />
            <label for="movies"> Filmes Favoritos: </label>
            <select id="movies" name="movies">
                <option value="inception"> A Origem </option>
                <option value="interstellar"> Interestelar </option>
                <option value="matrix"> Matrix </option>
                <option value="godfather"> O Poderoso Chefão </option>
            </select>
            <br />
            <label for="feedback"> Deixe um Feedback: </label> <br />
            <textarea id="feedback" name="feedback" rows="4" cols="50"></textarea> <br />
            <button type="submit" class="submit-button"> Enviar </button>
            <button type="reset" class="reset-button">Limpar   
            </button>        
        </form>
    </body>
</html>
