<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas HTML</title>
</head>
<body>
    <table></table>
        <caption> Notas de matemática </caption>
        <thead>
            <tr>
                <th> Nome do Aluno </th>
                <th> Nota do Aluno </th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td> Miguel </td>
                <td> 8 </td>
            </tr>
            <tr>
                <td> Ana </td>
                <td> 7 </td>
            </tr>
        <tfoot>
            <tr>
                <td> Média </td>
                <td> R$ 7,50 </td>
            </tr>
        </tfoot>
        </tfoot>
</body>
</html>
